[project]
name = "halcyon-mock-services"
version = "1.0.0"
description = "Mock calendar REST API and restaurant MCP server for the Halcyon concierge agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "mcp>=2.3,<3",
    "httpx2>=2.16,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.17,<0.18"]
# Only for regenerating app/calendar/rules.json with Claude.
rules = ["anthropic>=2.14,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.calendar" = ["rules.json"]
"app.restaurants" = ["restaurants.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
