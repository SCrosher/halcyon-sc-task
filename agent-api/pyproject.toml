[project]
name = "halcyon-agent-api"
version = "1.0.0"
description = "Halcyon dining-concierge agent API (Claude + memory + calendar API + restaurant MCP)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14,<3",
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "mcp>=2.3,<3",
    "httpx2>=2.16,<3",
    "jsonschema>=4.26,<5",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.17,<0.18"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
